<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Birthday Reminder</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;1,500&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --wine: #A9553A;
    --wine-deep: #7A3B27;
    --bg: #FBF3E7;
    --card: #FFFFFF;
    --ink: #3A2416;
    --muted: #8A7462;
    --gold: #C9A24B;
    --ok: #4C7A5A;
    --warn: #C1602E;
    --bad: #B3362B;
    --line: #ECDFCB;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0;
    font-family:'Jost', sans-serif;
    background: var(--bg);
    color: var(--ink);
  }
  header{
    padding: 28px 20px 12px;
    text-align:center;
  }
  header h1{
    font-family:'Cormorant Garamond', serif;
    font-style: italic;
    font-weight:600;
    font-size: 34px;
    color: var(--wine);
    margin:0;
  }
  header p{
    margin: 4px 0 0;
    color: var(--muted);
    font-size: 13.5px;
  }

  .tabs{
    display:flex;
    justify-content:center;
    gap:8px;
    margin: 16px 0 8px;
  }
  .tab-btn{
    border:none;
    background: transparent;
    color: var(--muted);
    font-family:'Jost', sans-serif;
    font-size: 14px;
    padding: 8px 16px;
    border-radius: 999px;
    cursor:pointer;
    transition: all .2s ease;
  }
  .tab-btn.active{ background: var(--wine); color: #fff; }
  .tab-btn:focus-visible, .btn:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible{
    outline: 2px solid var(--wine); outline-offset: 2px;
  }

  main{ max-width: 760px; margin: 0 auto; padding: 12px 16px 60px; }
  section{ display:none; }
  section.active{ display:block; }

  .banner{
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 13px;
    margin-bottom: 10px;
    line-height: 1.45;
  }
  .banner.warn{ background:#FBE9D9; color:#7A3B27; border:1px solid #F0CDB0; }
  .banner.bad{ background:#FBE0DC; color:#8A2A20; border:1px solid #F0B8B0; }

  .card{
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 18px 20px;
    margin-bottom: 14px;
  }

  .reminder-head{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    gap: 10px;
    flex-wrap: wrap;
  }
  .reminder-head h3{
    font-family:'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 21px;
    margin: 0;
    color: var(--wine);
  }
  .badge{
    font-size: 11.5px;
    padding: 3px 10px;
    border-radius: 999px;
    white-space: nowrap;
  }
  .badge.j-today{ background:#F6D9D4; color: var(--bad); font-weight:600; }
  .badge.j-soon{ background:#F7E3D3; color: var(--warn); }
  .badge.j-far{ background:#EFE7DA; color: var(--muted); }

  .meta{ font-size: 12.5px; color: var(--muted); margin-top: 2px; line-height:1.5; }
  .status-pill{
    display:inline-block;
    font-size: 11.5px;
    padding: 2px 9px;
    border-radius: 999px;
    margin-left: 4px;
    background:#EFE7DA;
    color: var(--ink);
  }
  .status-pill.ok{ background:#E3EEE6; color: var(--ok); }
  .status-pill.warn{ background:#F7E3D3; color: var(--warn); }
  .status-pill.bad{ background:#F6D9D4; color: var(--bad); }

  .error-line{
    margin-top: 8px;
    font-size: 12.5px;
    color: var(--bad);
  }

  textarea{
    width:100%;
    margin-top: 12px;
    min-height: 110px;
    font-family:'Jost', sans-serif;
    font-size: 14px;
    line-height:1.55;
    padding: 12px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: #FFFDF9;
    resize: vertical;
  }

  .actions{ display:flex; gap:8px; margin-top: 12px; flex-wrap: wrap; }

  button.btn{
    border:none;
    border-radius: 7px;
    padding: 9px 14px;
    font-family:'Jost', sans-serif;
    font-size: 13px;
    cursor:pointer;
    transition: opacity .15s ease;
  }
  button.btn:hover{ opacity:0.85; }
  button.btn:disabled{ opacity:0.4; cursor:not-allowed; }

  .btn-primary{ background: var(--wine); color:#fff; }
  .btn-secondary{ background: #F1E6D6; color: var(--ink); }
  .btn-ghost{ background: transparent; color: var(--muted); border: 1px solid var(--line); }
  .btn-send{ background: #3FA75C; color: #fff; }

  .empty{ text-align:center; color: var(--muted); padding: 40px 20px; font-size: 14px; }

  .toolbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap: 10px;
    margin-bottom: 10px;
    flex-wrap: wrap;
  }
  .toolbar label{ font-size: 12.5px; color: var(--muted); display:flex; gap:6px; align-items:center; }

  form.person-form{
    display:grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px 12px;
  }
  form.person-form .full{ grid-column: 1 / -1; }
  form.person-form label{ font-size: 12px; color: var(--muted); display:block; margin-bottom: 4px; }
  form.person-form input,
  form.person-form select,
  form.person-form textarea{
    width:100%;
    font-family:'Jost', sans-serif;
    font-size: 14px;
    padding: 9px 10px;
    border-radius: 7px;
    border: 1px solid var(--line);
    background: #FFFDF9;
  }
  form.person-form textarea{ min-height: 70px; resize: vertical; margin-top: 0; }
  form.person-form .check{ display:flex; gap:8px; align-items:flex-start; font-size: 13px; color: var(--ink); }
  form.person-form .check input{ width:auto; margin-top: 3px; }
  .hint{ font-size: 11.5px; color: var(--muted); margin-top: 3px; }
  .form-title{ font-family:'Cormorant Garamond', serif; font-style:italic; color:var(--wine); margin:0 0 12px; font-size: 22px; }

  .people-list{ margin-top: 18px; }
  .person-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap: 10px;
    padding: 12px 4px;
    border-bottom: 1px solid var(--line);
  }
  .person-row:last-child{ border-bottom:none; }
  .person-row .info b{ color: var(--wine); }
  .person-row .info span{ display:block; font-size: 12px; color: var(--muted); }
  .row-actions{ display:flex; gap:10px; }
  .row-actions button{
    background:none; border:none; cursor:pointer; font-size: 13px;
    color: var(--muted); text-decoration: underline;
  }

  .toast{
    position: fixed;
    bottom: 18px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--ink);
    color:#fff;
    padding: 10px 18px;
    border-radius: 999px;
    font-size: 13px;
    opacity: 0;
    pointer-events: none;
    transition: opacity .25s ease;
    max-width: 90vw;
    text-align:center;
  }
  .toast.show{ opacity: 0.95; }

  @media (max-width: 520px){
    form.person-form{ grid-template-columns: 1fr; }
  }
  @media (prefers-reduced-motion: reduce){ *{ transition:none !important; } }
</style>
</head>
<body>

<header>
  <h1>Birthday Reminder</h1>
  <p>Tes proches, leurs anniversaires, un message prêt à envoyer. Plus d'oubli.</p>
</header>

<div class="tabs">
  <button class="tab-btn active" data-tab="reminders">À traiter</button>
  <button class="tab-btn" data-tab="people">Mes proches</button>
</div>

<main>
  <section id="reminders" class="active">
    <div id="banners"></div>
    <div class="toolbar">
      <label><input type="checkbox" id="showAll"> Afficher aussi les rappels terminés</label>
      <button class="btn btn-ghost" id="refreshBtn">Vérifier maintenant</button>
    </div>
    <div id="remindersList"></div>
  </section>

  <section id="people">
    <div class="card">
      <h3 class="form-title" id="formTitle">Ajouter un proche</h3>
      <form class="person-form" id="personForm">
        <div class="full">
          <label for="f_name">Nom</label>
          <input id="f_name" type="text" name="name" required maxlength="120" placeholder="Ex : Grand frère Paul">
        </div>
        <div>
          <label for="f_day">Jour de naissance</label>
          <input id="f_day" type="number" name="birth_day" min="1" max="31" required>
        </div>
        <div>
          <label for="f_month">Mois</label>
          <select id="f_month" name="birth_month" required>
            <option value="1">Janvier</option><option value="2">Février</option><option value="3">Mars</option>
            <option value="4">Avril</option><option value="5">Mai</option><option value="6">Juin</option>
            <option value="7">Juillet</option><option value="8">Août</option><option value="9">Septembre</option>
            <option value="10">Octobre</option><option value="11">Novembre</option><option value="12">Décembre</option>
          </select>
        </div>
        <div>
          <label for="f_relation">Relation</label>
          <input id="f_relation" type="text" name="relation" required maxlength="80" placeholder="Ex : grand frère, amie, collègue">
        </div>
        <div>
          <label for="f_tone">Ton souhaité</label>
          <select id="f_tone" name="tone">
            <option value="chaleureux">Chaleureux</option>
            <option value="tres fort et emotionnel">Très fort / émotionnel</option>
            <option value="leger et fun">Léger et fun</option>
            <option value="sobre et respectueux">Sobre et respectueux</option>
          </select>
        </div>

        <div>
          <label for="f_channel">App pour lui écrire</label>
          <select id="f_channel" name="channel"></select>
        </div>
        <div>
          <label for="f_contact">Contact</label>
          <input id="f_contact" type="text" name="contact" maxlength="200">
          <div class="hint" id="contactHint"></div>
        </div>

        <div>
          <label for="f_timezone">Fuseau horaire de la personne</label>
          <input id="f_timezone" type="text" name="timezone" list="tzList" placeholder="Vide = ton fuseau">
          <datalist id="tzList">
            <option value="Europe/Paris"></option><option value="Europe/Berlin"></option><option value="Europe/London"></option>
            <option value="Europe/Brussels"></option><option value="Europe/Madrid"></option><option value="Europe/Rome"></option>
            <option value="Europe/Zurich"></option><option value="Europe/Lisbon"></option>
            <option value="America/Toronto"></option><option value="America/Montreal"></option><option value="America/New_York"></option>
            <option value="America/Chicago"></option><option value="America/Los_Angeles"></option>
            <option value="Africa/Douala"></option><option value="Africa/Abidjan"></option><option value="Africa/Dakar"></option>
            <option value="Africa/Lagos"></option><option value="Africa/Kinshasa"></option><option value="Africa/Casablanca"></option>
            <option value="Asia/Dubai"></option><option value="Pacific/Auckland"></option>
          </datalist>
          <div class="hint">Ex : Europe/Paris. Le message est prévu à l'heure locale de la personne.</div>
        </div>
        <div>
          <label for="f_hour">Heure d'envoi le jour J (heure locale)</label>
          <select id="f_hour" name="send_hour"></select>
        </div>

        <div class="full check" id="autoSendWrap" hidden>
          <input id="f_auto" type="checkbox" name="auto_send">
          <label for="f_auto" style="margin:0;color:inherit;">Envoyer automatiquement ce message par email le jour J, sans que j'aie à cliquer (le message doit être validé avant).</label>
        </div>

        <div class="full">
          <label for="f_context">Contexte / détails personnels (pour un message vraiment personnalisé)</label>
          <textarea id="f_context" name="context" maxlength="1000" placeholder="Ex : il vit en Europe, on s'appelle rarement, il adore le foot..."></textarea>
        </div>
        <div class="full" style="display:flex; gap:8px;">
          <button type="submit" class="btn btn-primary" id="submitBtn">Ajouter</button>
          <button type="button" class="btn btn-ghost" id="cancelEdit" hidden>Annuler</button>
        </div>
      </form>
    </div>

    <div class="people-list" id="peopleList"></div>
  </section>
</main>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="/app.js"></script>
</body>
</html>
